_format_version: '3.0'
_transform: true

services:
  - name: inmuebles-el-guarzo-backend
    url: http://host.docker.internal:3000
    routes:
      - name: all-routes
        paths:
          - /
        strip_path: false
    plugins:
      - name: request-transformer
        config:
          # Kong aplica remove antes que add: descarta los valores que mande el cliente
          remove:
            headers:
              - X-Kong-Secret
              - X-Original-Client-IP
          add:
            headers:
              - X-Kong-Secret:KONG_SECRET_PLACEHOLDER
              # IP del visitante para el backend: copia de CF-Connecting-IP (vacío si no viene)
              - 'X-Original-Client-IP:$(headers["cf-connecting-ip"])'
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: local
          redis:
            host: localhost
            port: 6379
            timeout: 2000
            database: 0
            ssl: false
            ssl_verify: false
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true

plugins:
  - name: response-transformer
    config:
      add:
        headers:
          - X-Powered-By:Kong-Gateway
