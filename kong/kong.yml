_format_version: '3.0'
_transform: true

services:
  - name: inmuebles-el-guarzo-backend
    url: http://inmuebles-el-guarzo-backend-7wli:10000
    routes:
      - name: all-routes
        paths:
          - /
        strip_path: false
    plugins:
      - name: request-transformer
        config:
          add:
            headers:
              - X-Kong-Secret:xZFEGnEMgAREqh6krTBZ2DM3lpITq9YBy4V1qOIRBlw=
      - name: rate-limiting
        config:
          minute: 5
          hour: 1000
          policy: local
          redis:
            host: localhost
            port: 6379
            timeout: 2000
            database: 0
            ssl: false
            ssl_verify: false
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true

plugins:
  - name: response-transformer
    config:
      add:
        headers:
          - X-Powered-By:Kong-Gateway
