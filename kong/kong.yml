_format_version: '3.0'
_transform: true

services:
  - name: inmuebles-el-guarzo-backend
    url: https://inmuebles-el-guarzo-backend-a1zk.onrender.com
    routes:
      # Solo el POST de creación: anclado y sin distinguir mayúsculas ni barra
      # final (como Express), para no capturar :id/approve|start-review|reject
      - name: public-publication-submit
        paths:
          - ~/(?i)api/v1/publications/?$
        methods:
          - POST
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              hour: 30
              policy: local
              limit_by: header
              header_name: CF-Connecting-IP
      - name: all-routes
        paths:
          - /
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - X-Origin-Verify
          key_in_header: true
          key_in_query: false
          key_in_body: false
          hide_credentials: true
      - name: request-transformer
        config:
          add:
            headers:
              - X-Kong-Secret:KONG_SECRET_PLACEHOLDER
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: local
          limit_by: header
          header_name: CF-Connecting-IP
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true

  # Health check de Render: llega directo a Kong, sin Cloudflare ni X-Origin-Verify.
  # Servicio aparte para no heredar key-auth, rate-limiting ni request-transformer
  # (el backend exime /api/v1/health de su guard). Misma url que el servicio
  # principal: si cambia, cambiar ambas.
  # En plan Free se reenvía al backend a propósito: estos health checks son lo que
  # despierta al backend cuando despierta Kong. Al pasar a un plan sin cold start,
  # reemplazar el servicio por una ruta con request-termination (status_code 200)
  # para que el health de Kong mida solo a Kong.
  - name: render-health-check
    url: https://inmuebles-el-guarzo-backend-a1zk.onrender.com
    routes:
      - name: render-health-check
        paths:
          - ~/api/v1/health$
        methods:
          - GET
        strip_path: false

consumers:
  - username: cloudflare-edge
    keyauth_credentials:
      - key: 'ORIGIN_VERIFY_PLACEHOLDER'

plugins:
  - name: response-transformer
    config:
      add:
        headers:
          - X-Powered-By:Kong-Gateway
